<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Burris Legacy | Family Archive</title>

    <meta name="description" content="Preserving the records, stories, responsibilities, and treasures entrusted from one generation of the Burris family to the next.">

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            font-family: Georgia, "Times New Roman", serif;
            background:#f6f1e7;
            color:#3b3127;
            display:flex;
            justify-content:center;
            align-items:center;
            min-height:100vh;
            text-align:center;
            padding:40px 20px;
        }

        .container{
            max-width:900px;
            width:100%;
        }

        img{
            max-width:700px;
            width:100%;
            height:auto;
            margin-bottom:50px;
        }

        .divider{
            width:180px;
            height:1px;
            background:#b89a58;
            margin:40px auto;
        }

        .mission{
            font-size:1.55rem;
            line-height:1.9;
            max-width:700px;
            margin:0 auto;
            color:#44382d;
        }

        .status{
            margin-top:55px;
            font-style:italic;
            font-size:1.7rem;
            color:#6d5535;
        }

        .coming{
            margin-top:25px;
            letter-spacing:8px;
            font-size:2rem;
            color:#4b3b28;
        }

        footer{
            margin-top:80px;
            font-size:.95rem;
            color:#777;
        }

        @media (max-width:768px){

            img{
                margin-bottom:35px;
            }

            .mission{
                font-size:1.25rem;
                line-height:1.7;
            }

            .status{
                font-size:1.35rem;
            }

            .coming{
                font-size:1.55rem;
                letter-spacing:5px;
            }
        }

    </style>

</head>

<body>

<div class="container">

    <img src="images/burris-legacy-family-archive.png"
         alt="The Burris Legacy">

    <div class="divider"></div>
<br>
    <p class="mission">
        Preserving the records,
        stories, responsibilities,
        and treasures entrusted
        from one generation of the
        Burris family to the next.
    </p>
<br>
    <div class="divider"></div>

    <div class="status">
        The Archive Is Being Assembled
    </div>

    <div class="coming">
        COMING SOON
    </div>

    <footer>
        The Burris Legacy
    </footer>

</div>

</body>
</html>
